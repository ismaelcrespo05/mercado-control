{% extends "productos/base.html" %}
{% block title %}Editar avaria — Mercatrol{% endblock %}

{% block content %}
<h1>Editar avaria</h1>

<div class="card" style="max-width: 520px;">
  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="codigo_barra">Código de barras</label>
      <input type="tel" id="codigo_barra" name="codigo_barra" value="{{ avaria.codigo_barra }}" required>
    </div>

    <div class="form-group">
      <label for="nombre">Nome do produto</label>
      <input type="text" id="nombre" name="nombre" value="{{ avaria.nombre }}" required>
    </div>

    <div class="form-group">
      <label for="tipo_danio">Tipo de avaria</label>
      <select id="tipo_danio" name="tipo_danio" required>
        <option value="">— Selecione o tipo —</option>
        {% for valor, etiqueta in tipos %}
        <option value="{{ valor }}" {% if avaria.tipo_danio == valor %}selected{% endif %}>{{ etiqueta }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group">
      <label for="cantidad">Quantidade de unidades com avaria</label>
      <input type="number" id="cantidad" name="cantidad" value="{{ avaria.cantidad }}" min="1" required>
    </div>

    <div style="display:flex; gap:0.75rem; margin-top:1.5rem;">
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
      <a href="{% url 'listar_avarias' %}" class="btn btn-ghost">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
