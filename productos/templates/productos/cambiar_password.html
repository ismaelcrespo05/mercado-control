{% extends "productos/base.html" %}
{% block title %}Cambiar contraseña — Mercatrol{% endblock %}

{% block content %}
<h1 data-i18n="password.title">Cambiar mi contraseña</h1>

<div class="card" style="max-width: 420px;">
  <form method="post">
    {% csrf_token %}

    <div class="form-group">
      <label for="password_actual" data-i18n="password.actual">Contraseña actual</label>
      <input type="password" id="password_actual" name="password_actual" required autofocus>
    </div>

    <div class="form-group">
      <label for="password_nueva" data-i18n="password.nueva">Nueva contraseña</label>
      <input type="password" id="password_nueva" name="password_nueva" required minlength="6">
    </div>

    <div class="form-group">
      <label for="password_confirmar" data-i18n="password.confirmar">Confirmar nueva contraseña</label>
      <input type="password" id="password_confirmar" name="password_confirmar" required minlength="6">
    </div>

    <div style="display:flex; gap:0.75rem; margin-top:1.25rem;">
      <button type="submit" class="btn btn-primary" data-i18n="password.actualizar">Actualizar contraseña</button>
      <a href="{% url 'dashboard' %}" class="btn btn-ghost" data-i18n="buttons.cancelar">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
